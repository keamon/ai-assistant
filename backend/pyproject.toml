[project]
name = "ssim-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the SSIM Employee Digital Assistant demo (ADK + shared mock store)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "google-adk>=1.15.0,<2.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.130.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uvicorn]
# run with: uv run uvicorn server.main:app --reload --port 8000

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
