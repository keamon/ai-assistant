[project]
name = "fintechco-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the FinTechCo Employee Digital Assistant demo (ADK + shared mock store)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "google-adk>=1.15.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.78,<1.0",
    "litellm>=1.83.7,<=1.83.14",
]

[tool.uvicorn]
# run with: uv run uvicorn server.main:app --reload --port 8000

[dependency-groups]
# Dev/test tooling — installed by `uv sync` and used in CI (see .github/workflows/ci.yml).
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",  # required by fastapi.testclient.TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `import server` resolves from the backend root
addopts = "-q"
# Tests run hermetically (no live model calls, no network) via the DEMO_DISABLE_LIVE_MARKET
# env var set in tests/conftest.py, so the market-data layer always uses fixtures.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
